id: lodestar
name: Lodestar
version: 0.1.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5183
      - http://127.0.0.1:5183
      - http://localhost:5174
      - http://127.0.0.1:5174
  data:
    enabled: true
    dialect: mssql
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build
    indexDocument: index.html
    assetAccess: public
    embedded:
      only: false
  storage:
    enabled: false
  functions:
    enabled: false
