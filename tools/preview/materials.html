<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lodestar — materials</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05080b;
        color: #9fb3ad;
        font:
          12px ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      p {
        position: fixed;
        left: 12px;
        top: 4px;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <p>baked floor · probe-lit box (N = night vision, A = alarm) · glow ball · additive flare · one moving light</p>
    <script type="module">
      // A sanity page for the three shader programs in src/gfx/materials.js.
      import * as THREE from 'three';
      import { lit, glow, shared, ownMaterials, setProbe } from '/src/gfx/materials.js';
      import { box, merge } from '/src/gfx/geo.js';

      const canvas = document.getElementById('c');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 200);
      camera.position.set(4, 3, 7);
      camera.lookAt(0, 0.8, 0);

      // baked: light lives in the vertex colours
      const floor = new THREE.PlaneGeometry(16, 16, 16, 16).rotateX(-Math.PI / 2);
      const light = new Float32Array(floor.attributes.position.count * 3);
      for (let i = 0; i < floor.attributes.position.count; i++) {
        const d = Math.hypot(floor.attributes.position.getX(i), floor.attributes.position.getZ(i));
        const k = Math.max(0, 1 - d / 7) ** 2;
        light.set([0.02 + 1.1 * k, 0.03 + 0.8 * k, 0.05 + 0.45 * k], i * 3);
      }
      floor.setAttribute('color', new THREE.BufferAttribute(light, 3));
      scene.add(new THREE.Mesh(floor, lit({ baked: true, color: 0x9a9a92 })));

      // probe-lit: paint in the vertex colours, light from uProbe
      const model = new THREE.Mesh(
        merge([box(1, 1, 1, 0x3b4650, [0, 0.5, 0]), box(0.5, 0.5, 0.5, 0xc98a2b, [0, 1.25, 0])]),
        lit({ vertexColors: true, rim: 0.6 }),
      );
      scene.add(model);
      const mats = ownMaterials(model);
      setProbe(mats, new THREE.Color(0.9, 0.7, 0.45));

      const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 8), glow({ color: 0xffc070, intensity: 3 }));
      lamp.position.set(-2, 1.2, 0);
      scene.add(lamp);
      const flare = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.6), glow({ color: 0x40ffd0, additive: true }));
      flare.position.set(2, 1.2, 0);
      scene.add(flare);

      addEventListener('keydown', (e) => {
        if (e.code === 'KeyN') shared.uNight.value = shared.uNight.value ? 0 : 1;
        if (e.code === 'KeyA') shared.uAlarm.value = shared.uAlarm.value ? 0 : 1;
      });
      const q = new URLSearchParams(location.search);
      shared.uNight.value = Number(q.get('night') || 0);
      shared.uAlarm.value = Number(q.get('alarm') || 0);

      let frames = 0;
      function frame(ms) {
        const t = ms / 1000;
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        if (canvas.width !== w || canvas.height !== h) {
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }
        shared.uTime.value = t;
        shared.uDynPos.value[0].set(Math.cos(t) * 3, 0.6, Math.sin(t) * 3, 4);
        shared.uDynCol.value[0].set(0.2, 0.9, 1.4);
        model.rotation.y = t * 0.5;
        renderer.render(scene, camera);
        if (++frames === 5) window.__ready = true;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
