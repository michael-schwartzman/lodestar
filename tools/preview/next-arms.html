<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lodestar — next arms</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05080b;
        color: #9fb3ad;
        font:
          12px ui-monospace,
          Menlo,
          Consolas,
          monospace;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        left: 10px;
        top: 6px;
        white-space: pre;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud"></div>
    <script type="module">
      // A viewer for src/gfx/next/sidearms.js and src/gfx/next/knife.js — the pistol, shotgun, knife and
      // grenade's second look — built the same way tools/preview/next-carbine.html views the carbine, so the
      // same eye can compare them.
      //
      // ?gun=pistol|shotgun|knife|grenade     which weapon (default: pistol)
      // &show=static|fp                       a turntable pedestal, or the true first-person rig (default: static)
      // &view=side|quarter|front|top|grip     camera angle for ?show=static (default: quarter)
      // &pose=hip|aim                         ?show=fp only — the two poses weapon.js itself uses
      // &probe=dim|warm|cold|bright           the light colour fed to ownMaterials()/setProbe() (default: bright)
      // &detail=low|medium|high               setGeoDetail before building (default: medium)
      // &solo=armL|armR|body|bolt|mag|knife|grenade   hide every other top-level part, for a close look at one
      import * as THREE from 'three';
      import { lit, ownMaterials, setProbe, setLook } from '/src/gfx/materials.js';
      import { setGeoDetail } from '/src/gfx/geo.js';
      import { LOOK_GLSL } from '/src/look/glsl.js';
      import { loadMatter } from '/src/look/matter.js';
      import { buildPistol, buildShotgun, buildGrenadeBody, buildGrenade } from '/src/gfx/next/sidearms.js';
      import { buildKnife } from '/src/gfx/next/knife.js';

      const q = new URLSearchParams(location.search);
      const gunName = q.get('gun') || 'pistol';
      const show = q.get('show') || 'static';
      const view = q.get('view') || 'quarter';
      const fpMode = show === 'fp';
      const pose = q.get('pose') || 'hip';
      const probeName = q.get('probe') || 'bright';
      const detailName = q.get('detail') || 'medium';
      const solo = q.get('solo') || '';

      const DETAIL = {
        low: { bevel: false, round: 1 },
        medium: { bevel: true, round: 1.5 },
        high: { bevel: true, round: 2 },
      };
      setLook({ on: true, matter: true, glsl: LOOK_GLSL });
      await loadMatter({ size: 512 });
      setGeoDetail({ ...(DETAIL[detailName] || DETAIL.medium), matter: true });

      const PROBES = {
        dim: new THREE.Color(0.08, 0.1, 0.14),
        warm: new THREE.Color(0.55, 0.42, 0.3),
        cold: new THREE.Color(0.3, 0.38, 0.48),
        bright: new THREE.Color(1.05, 1.02, 0.95),
      };
      const probeColor = PROBES[probeName] || PROBES.bright;

      // --------------------------------------------------------------------------------------------- the guns
      // feel.hip/feel.eye come straight from src/weapon.js's own FEEL table (pistol/shotgun); KNIFE_REST and
      // LOB_BACK are its own knife/grenade hand constants — so the fp previews sit exactly where the game holds
      // each weapon, not a guess.
      const GUNS = {
        pistol: {
          build: buildPistol,
          hip: [0.17, -0.19, -0.42],
          eye: 0.22,
          grip: [-0.08, 0.1, 0.13],
          gripLook: [0.01, -0.05, 0.02],
        },
        shotgun: {
          build: buildShotgun,
          hip: [0.17, -0.2, -0.42],
          eye: 0.2,
          grip: [-0.09, 0.1, 0.16],
          gripLook: [0.01, -0.06, 0.03],
        },
        knife: {
          build: buildKnife,
          // weapon.js's own KNIFE_REST / KNIFE_BLOW — there is no `sight`, so "aim" here is the blow pose.
          restPose: { x: -0.24, y: -0.22, z: -0.5, rx: 0.35, ry: -0.35, rz: 0.15 },
          blowPose: { x: -0.04, y: -0.15, z: -0.6, rx: 0.42, ry: -0.32, rz: -0.25 },
          grip: [0.12, 0.05, 0.12],
          gripLook: [0, 0, -0.08],
        },
        grenade: {
          build: buildGrenade,
          buildBody: buildGrenadeBody,
          // weapon.js's own LOB_BACK / LOB_OUT.
          restPose: { x: -0.27, y: -0.2, z: -0.46, rx: 0.55, ry: -0.4, rz: 0.2 },
          blowPose: { x: -0.07, y: -0.1, z: -0.66, rx: 0.18, ry: -0.25, rz: -0.2 },
          grip: [0.12, 0.05, 0.12],
          gripLook: [0, 0, 0.04],
        },
        // the grenade in flight, no fist — buildGrenadeBody() on its own, for a clean look at its shape alone
        // (?gun=grenadeBody; ?show=static only, it is never held at the hip or aimed).
        grenadeBody: { build: buildGrenadeBody },
      };
      const spec = GUNS[gunName] || GUNS.pistol;

      // --------------------------------------------------------------------------------------------- build + count
      function triCount(geometry) {
        if (!geometry) return 0;
        return (geometry.index ? geometry.index.count : geometry.attributes.position.count) / 3;
      }
      function countModel(root, parts) {
        const nameOf = (o) => {
          for (const [k, v] of Object.entries(parts || {})) if (o === v) return k;
          return o.name || 'other';
        };
        const perPart = {};
        let n = 0;
        root.traverse((node) => {
          if (!node.isMesh) return;
          const t = triCount(node.geometry);
          n += t;
          const k = nameOf(node);
          perPart[k] = (perPart[k] || 0) + t;
        });
        return { total: Math.round(n), perPart };
      }

      let model = null;
      try {
        model = spec.build();
      } catch (e) {
        console.error(`${gunName}: threw — ${(e && e.stack) || e}`);
      }
      const triangles = model ? countModel(model.root, model.parts) : { total: 0, perPart: {} };
      window.__models = { triangles, detail: detailName, gun: gunName };

      if (model) setProbe(ownMaterials(model.root), probeColor);
      if (model && solo && model.parts[solo])
        for (const [k, v] of Object.entries(model.parts)) if (k !== solo && v && v.isObject3D) v.visible = false;

      // --------------------------------------------------------------------------------------------- scene
      const canvas = document.getElementById('c');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(fpMode ? 55 : 50, 1, 0.03, 300);

      function makeFloor(size) {
        const geo = new THREE.PlaneGeometry(size, size, 24, 24).rotateX(-Math.PI / 2);
        const col = new Float32Array(geo.attributes.position.count * 3);
        for (let i = 0; i < geo.attributes.position.count; i++) {
          const d = Math.hypot(geo.attributes.position.getX(i), geo.attributes.position.getZ(i));
          const k = Math.max(0, 1 - d / (size * 0.55)) ** 2;
          col.set([0.03 + 0.5 * k, 0.035 + 0.46 * k, 0.045 + 0.4 * k], i * 3);
        }
        geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
        return new THREE.Mesh(geo, lit({ baked: true }));
      }

      let pedestal = null;
      function place(m, displayY) {
        const group = new THREE.Group();
        group.position.set(0, displayY, 0);
        group.add(m.root);
        scene.add(group);
        m.root.updateMatrixWorld(true);
        const box3 = new THREE.Box3().setFromObject(m.root);
        const size = box3.getSize(new THREE.Vector3());
        const radius = Math.max(size.x, size.y, size.z, 0.1) * 0.5;
        pedestal = {
          group,
          radius,
          centerY: displayY + (box3.min.y + box3.max.y) / 2,
          lookY: displayY + box3.min.y + size.y * 0.45,
          box3,
        };
      }

      function frameOn(viewName) {
        const { radius: fullRadius, centerY, box3 } = pedestal;
        const soloScale = solo === 'body' || solo === 'knife' || solo === 'grenade' ? 0.75 : 0.18;
        const radius = solo ? fullRadius * soloScale : fullRadius;
        const dist = radius / Math.tan((camera.fov * Math.PI) / 180 / 2) + radius * 1.08;
        // centerY is pulled down by the long arm/sleeve chain hanging well below the gun's own local origin —
        // recovering the bare displayY (world Y of the gun's own local (0,0,0), same trick as next-carbine.html's
        // 'optic' view) lets the grip view's small, gun-scaled offsets land on the grip, not in the sleeve.
        const displayY = centerY - (box3.min.y + box3.max.y) / 2;
        const positions = {
          front: [0, centerY + radius * 0.15, -dist],
          back: [0, centerY + radius * 0.15, dist],
          side: [dist, centerY + radius * 0.15, 0],
          quarter: [dist * 0.68, centerY + dist * 0.38, -dist * 0.68],
          top: [0.001, centerY + dist * 1.1, 0.001],
        };
        // a close view of the grip/trigger-guard area and the firing hand wrapped round it — small, local-space
        // offsets off the gun's own origin (not the arm-swept bbox), scaled per gun in the GUNS table above; only
        // some GUNS entries (the held weapons) define one, so it is added lazily, not as a positions-literal key.
        if (spec.grip) positions.grip = [spec.grip[0], displayY + spec.grip[1], spec.grip[2]];
        const p = positions[viewName] || positions.quarter;
        camera.position.set(p[0], p[1], p[2]);
        if (viewName === 'grip' && spec.gripLook)
          camera.lookAt(spec.gripLook[0], displayY + spec.gripLook[1], spec.gripLook[2]);
        else camera.lookAt(0, pedestal.lookY, 0);
        camera.near = Math.max(0.01, dist * 0.01);
        camera.far = dist * 8 + 60;
        camera.updateProjectionMatrix();
      }

      function makePost(at) {
        const geo = new THREE.BoxGeometry(0.05, 1.8, 0.05);
        geo.translate(0, 0.9, 0);
        const col = new Float32Array(geo.attributes.position.count * 3).fill(0);
        for (let i = 0; i < geo.attributes.position.count; i++) col.set([0.73, 0.76, 0.78], i * 3);
        geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
        const m = new THREE.Mesh(geo, lit({ baked: true }));
        m.position.set(at[0], 0, at[2]);
        return m;
      }

      if (fpMode) {
        // true first-person rig: camera at the origin, the gun placed exactly the way weapon.js places it.
        if (model) {
          const { root, parts } = model;
          scene.add(root);
          if (spec.eye !== undefined) {
            // pistol / shotgun: a real `sight`, read once, exactly as weapon.js's own `aimed` vector does.
            if (pose === 'aim' && parts.sight) {
              const s = parts.sight.getWorldPosition(new THREE.Vector3());
              root.position.set(-s.x, -s.y, -spec.eye - s.z);
              root.rotation.set(0, 0, 0);
            } else {
              root.position.set(spec.hip[0], spec.hip[1], spec.hip[2]);
              root.rotation.set(0, 0, 0);
            }
          } else {
            // knife / grenade: weapon.js's own rest/blow hand poses — there is no sight to look down.
            const p = pose === 'aim' ? spec.blowPose : spec.restPose;
            root.position.set(p.x, p.y, p.z);
            root.rotation.set(p.rx, p.ry, p.rz);
          }
        }
        camera.position.set(0, 0, 0);
        camera.rotation.set(0, 0, 0);
        camera.near = 0.01;
        camera.far = 20;
        camera.updateProjectionMatrix();
        // a sight-line diagnostic: a small bright crosshair marker straight down -Z from the eye, dead ahead at
        // the sight's own height — on `pose=aim`, if the eye at parts.sight truly has nothing of the gun across
        // the middle, this marker shows whole and unobstructed through the notch/ring/dot; any dark gun silhouette
        // crossing it is a real blockage, not a trick of a black background matching the gun's own dark paint.
        const crossGeo = new THREE.BufferGeometry();
        const crossCol = [];
        const crossPos = [];
        const arm = 0.09;
        for (const [x1, y1, x2, y2] of [
          [-arm, 0, arm, 0],
          [0, -arm, 0, arm],
        ])
          for (const t of [0, 1]) crossPos.push(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, -4);
        for (let i = 0; i < 4; i++) crossCol.push(1, 0.2, 0.15);
        crossGeo.setAttribute('position', new THREE.Float32BufferAttribute(crossPos, 3));
        crossGeo.setAttribute('color', new THREE.Float32BufferAttribute(crossCol, 3));
        const cross = new THREE.LineSegments(
          crossGeo,
          new THREE.LineBasicMaterial({ vertexColors: true, toneMapped: false }),
        );
        scene.add(cross);
        scene.background = new THREE.Color(0x1d3450); // a lit, non-black backdrop: a dark gun part reads as a
        // silhouette against it, instead of vanishing into a black clear colour the way it would downrange at night.
      } else {
        scene.add(makeFloor(10));
        scene.add(makePost([-0.6, 0, 0.3]));
        if (model) place(model, 1.0);
        if (pedestal) frameOn(view);
        window.__pedestal = pedestal;
      }

      const hud = document.getElementById('hud');
      hud.textContent =
        `gun=${gunName} show=${fpMode ? 'fp:' + pose : 'static:' + view} probe=${probeName} detail=${detailName}\n` +
        `${gunName}: ${triangles.total} tri  ` +
        Object.entries(triangles.perPart)
          .map(([k, v]) => `${k}:${v}`)
          .join('  ');

      function layout() {
        const w = canvas.clientWidth,
          h = canvas.clientHeight;
        if (canvas.width !== w || canvas.height !== h) {
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }
      }

      let frames = 0;
      function frame() {
        layout();
        renderer.render(scene, camera);
        if (++frames === 4) window.__ready = true;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
