<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lodestar — models</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05080b;
        color: #9fb3ad;
        font:
          12px ui-monospace,
          Menlo,
          Consolas,
          monospace;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        left: 10px;
        top: 6px;
        white-space: pre;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud"></div>
    <script type="module">
      // A viewer for src/gfx/models.js — the things that move or are held.
      //
      // ?show=sentry|drone|carbine|carbineFP|centrifuge|charge|beacon|pistol|pistolFP|shotgun|shotgunFP|grenade|all
      //                                       what to draw (default: all)
      // &view=front|side|back|quarter|top    camera angle for a single model (ignored by *FP shows)
      // &pose=rest|walk|aim                  sentry: a walk mid-stride, or armR raised to aim;
      //                                       drone: rotors are always shown turned, whatever pose says;
      //                                       carbine/pistol: anything but "rest" drops the mag and racks the
      //                                       slide back; shotgun: anything but "rest" racks the pump back
      // &pose=hip|aim                        carbineFP/pistolFP/shotgunFP only — the two first-person poses
      // &probe=dim|warm|cold|bright          the light colour fed to ownMaterials()/setProbe() (default: bright)
      import * as THREE from 'three';
      import { lit, ownMaterials, setProbe } from '/src/gfx/materials.js';
      import { box, merge } from '/src/gfx/geo.js';
      import {
        buildSentry,
        buildDrone,
        buildCarbine,
        buildCentrifugeGeometry,
        buildCharge,
        buildBeacon,
      } from '/src/gfx/models.js';
      import { buildPistol, buildShotgun, buildGrenade } from '/src/gfx/sidearms.js';

      const q = new URLSearchParams(location.search);
      const show = q.get('show') || 'all';
      const view = q.get('view') || 'quarter';
      const fpShows = new Set(['carbineFP', 'pistolFP', 'shotgunFP']);
      const pose = q.get('pose') || (fpShows.has(show) ? 'hip' : 'rest');
      const probeName = q.get('probe') || 'bright';

      // dim is the exact value a dark corner of the site gives (see DESIGN.md 8.1); warm/cold/bright are mine,
      // just spanning the range a model has to read in.
      const PROBES = {
        dim: new THREE.Color(0.08, 0.1, 0.14),
        warm: new THREE.Color(0.55, 0.42, 0.3),
        cold: new THREE.Color(0.3, 0.38, 0.48),
        bright: new THREE.Color(1.05, 1.02, 0.95),
      };
      const probeColor = PROBES[probeName] || PROBES.bright;

      // --------------------------------------------------------------------------------------------- build + count
      function triCount(geometry) {
        if (!geometry) return 0;
        return (geometry.index ? geometry.index.count : geometry.attributes.position.count) / 3;
      }
      function countModel(root) {
        let n = 0;
        root.traverse((node) => {
          if (node.isMesh) n += triCount(node.geometry);
        });
        return Math.round(n);
      }
      function safeBuild(name, fn) {
        try {
          return fn();
        } catch (e) {
          console.error(`${name}: threw — ${(e && e.stack) || e}`);
          return null;
        }
      }

      const built = {
        sentry: safeBuild('sentry', buildSentry),
        drone: safeBuild('drone', buildDrone),
        carbine: safeBuild('carbine', buildCarbine),
        charge: safeBuild('charge', buildCharge),
        beacon: safeBuild('beacon', buildBeacon),
        pistol: safeBuild('pistol', buildPistol),
        shotgun: safeBuild('shotgun', buildShotgun),
        grenade: safeBuild('grenade', buildGrenade),
      };
      const centrifugeGeo = safeBuild('centrifuge', buildCentrifugeGeometry);
      const centrifugeMat = lit({ vertexColors: true, rim: 0.5 });
      const centrifugeMesh = centrifugeGeo ? new THREE.Mesh(centrifugeGeo, centrifugeMat) : null;

      const triangles = {
        sentry: built.sentry ? countModel(built.sentry.root) : 0,
        drone: built.drone ? countModel(built.drone.root) : 0,
        carbine: built.carbine ? countModel(built.carbine.root) : 0,
        centrifuge: centrifugeGeo ? Math.round(triCount(centrifugeGeo)) : 0,
        charge: built.charge ? countModel(built.charge.root) : 0,
        beacon: built.beacon ? countModel(built.beacon.root) : 0,
        pistol: built.pistol ? countModel(built.pistol.root) : 0,
        shotgun: built.shotgun ? countModel(built.shotgun.root) : 0,
        grenade: built.grenade ? countModel(built.grenade.root) : 0,
      };
      window.__models = { triangles };

      // what each may cost: the centrifuge is drawn hundreds of times, the carbine once and from a hand's breadth
      const BUDGET = {
        sentry: 4000,
        drone: 2000,
        carbine: 10000,
        centrifuge: 150,
        charge: 600,
        beacon: 700,
        pistol: 6500,
        shotgun: 8500,
        grenade: 2800,
      };
      for (const k of Object.keys(BUDGET)) {
        if (triangles[k] > BUDGET[k]) console.warn(`${k}: ${triangles[k]} triangles, over its ${BUDGET[k]} budget`);
      }

      // every model gets its own materials and probe, exactly the way the game lights each instance.
      for (const name of Object.keys(built)) {
        if (!built[name]) continue;
        setProbe(ownMaterials(built[name].root), probeColor);
      }
      let centrifugeMats = null;
      if (centrifugeMesh) {
        const wrap = new THREE.Group();
        wrap.add(centrifugeMesh);
        centrifugeMats = ownMaterials(wrap);
        setProbe(centrifugeMats, probeColor);
      }

      // --------------------------------------------------------------------------------------------- poses
      function applyPose(name, model) {
        if (!model) return;
        const p = model.parts;
        if (name === 'sentry') {
          if (pose === 'walk') {
            p.legL.rotation.x = 0.5;
            p.shinL.rotation.x = 0.55;
            p.legR.rotation.x = -0.45;
            p.shinR.rotation.x = 0.1;
            p.hips.rotation.y = 0.06;
            p.torso.rotation.y = -0.07;
            p.armL.rotation.x = -0.3;
            p.armR.rotation.x = 0.2;
          } else if (pose === 'aim') {
            p.armR.rotation.x = 1.45; // must point the gun straight ahead, level — see DESIGN.md 8.2
            p.torso.rotation.x = 0.04;
          }
        } else if (name === 'drone') {
          // rotors are always shown turning: four different angles prove the hubs are independent.
          p.rotors.forEach((r, i) => (r.rotation.y = 0.3 + i * 0.8 + (pose !== 'rest' ? 1.6 : 0)));
        } else if (name === 'carbine') {
          if (pose !== 'rest') {
            p.mag.position.y -= 0.12;
            p.mag.rotation.x = -0.4;
            p.bolt.position.z += 0.035;
          }
        } else if (name === 'pistol') {
          if (pose !== 'rest') {
            p.mag.position.y -= 0.12;
            p.mag.rotation.x = -0.4;
            p.bolt.position.z += 0.03;
          }
        } else if (name === 'shotgun') {
          if (pose !== 'rest') p.bolt.position.z += 0.09; // the pump; armL rides along, being its child
        }
      }
      for (const name of Object.keys(built)) applyPose(name, built[name]);

      // --------------------------------------------------------------------------------------------- scene
      const canvas = document.getElementById('c');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      const scene = new THREE.Scene();
      const fpMode = fpShows.has(show);
      const camera = new THREE.PerspectiveCamera(fpMode ? 55 : 50, 1, 0.03, 300);

      // baked floor: the same radial-falloff trick as tools/preview/materials.html, just so models stand on
      // something and scale can be judged.
      function makeFloor(size) {
        const geo = new THREE.PlaneGeometry(size, size, 24, 24).rotateX(-Math.PI / 2);
        const col = new Float32Array(geo.attributes.position.count * 3);
        for (let i = 0; i < geo.attributes.position.count; i++) {
          const d = Math.hypot(geo.attributes.position.getX(i), geo.attributes.position.getZ(i));
          const k = Math.max(0, 1 - d / (size * 0.55)) ** 2;
          col.set([0.03 + 0.5 * k, 0.035 + 0.46 * k, 0.045 + 0.4 * k], i * 3);
        }
        geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
        return new THREE.Mesh(geo, lit({ baked: true }));
      }
      // a 1.8 m reference post, baked light, so height reads at a glance next to a model
      function makePost(at) {
        const g = merge([
          box(0.05, 1.8, 0.05, 0xb9c3c6, [0, 0.9, 0], undefined, { bottom: 0.5, top: 0.95 }),
          box(0.09, 0.02, 0.09, 0xe0922e, [0, 1.8, 0]),
        ]);
        const m = new THREE.Mesh(g, lit({ baked: true }));
        m.position.set(at[0], 0, at[2]);
        return m;
      }
      // a small backing panel standing in for "the machine" the charge is stuck to
      function makePanel(at) {
        const g = box(0.7, 0.7, 0.05, 0x2a3136, [0, 0, -0.025]);
        const m = new THREE.Mesh(g, lit({ baked: true, color: 0x8d9497 }));
        m.position.set(at[0], at[1], at[2]);
        return m;
      }

      const pedestals = []; // { group, radius, centerY, lookY }
      function place(name, model, at, displayY) {
        if (!model) return;
        const group = new THREE.Group();
        group.position.set(at[0], displayY, at[2]);
        group.add(model.root);
        scene.add(group);
        model.root.updateMatrixWorld(true);
        const box3 = new THREE.Box3().setFromObject(model.root);
        const size = box3.getSize(new THREE.Vector3());
        const radius = Math.max(size.x, size.y, size.z, 0.3) * 0.5;
        pedestals.push({
          group,
          radius,
          centerY: displayY + (box3.min.y + box3.max.y) / 2,
          lookY: displayY + box3.min.y + size.y * 0.45,
        });
      }

      function frameOn(pedestal, viewName) {
        const { group, radius, centerY, lookY } = pedestal;
        const cx = group.position.x;
        const cz = group.position.z;
        const dist = radius / Math.tan((camera.fov * Math.PI) / 180 / 2) + radius * 1.6;
        const positions = {
          // models face -Z, so the camera sits on the -Z side to see the front.
          front: [cx, centerY + radius * 0.15, cz - dist],
          back: [cx, centerY + radius * 0.15, cz + dist],
          side: [cx + dist, centerY + radius * 0.15, cz],
          quarter: [cx + dist * 0.72, centerY + dist * 0.42, cz - dist * 0.72],
          top: [cx + 0.001, centerY + dist * 1.25, cz + 0.001],
        };
        const p = positions[viewName] || positions.quarter;
        camera.position.set(p[0], p[1], p[2]);
        camera.lookAt(cx, lookY, cz);
        camera.near = Math.max(0.02, dist * 0.01);
        camera.far = dist * 8 + 60;
        camera.updateProjectionMatrix();
      }

      let singlePedestal = null;

      if (fpMode) {
        // true first-person rig: camera at the origin, the gun placed the way the brief pins it down.
        const gun = show === 'pistolFP' ? built.pistol : show === 'shotgunFP' ? built.shotgun : built.carbine;
        if (gun) {
          const { root, parts } = gun;
          scene.add(root);
          if (pose === 'aim') {
            const sightLocal = parts.sight.position;
            root.position.set(-sightLocal.x, -sightLocal.y, -0.16 - sightLocal.z);
            root.rotation.set(0, 0, 0);
          } else {
            root.position.set(0.17, -0.19, -0.42);
            root.rotation.set(0, 0.12, 0); // turned very slightly inward
          }
        }
        camera.position.set(0, 0, 0);
        camera.rotation.set(0, 0, 0);
        camera.near = 0.01;
        camera.far = 20;
        camera.updateProjectionMatrix();
      } else if (show === 'all') {
        scene.add(makeFloor(26));
        scene.add(makePost([-7.6, 0, 1]));
        if (built.sentry) place('sentry', built.sentry, [-6, 0, 0], 0);
        if (built.drone) place('drone', built.drone, [-3, 0, 0], 1.3);
        if (built.carbine) place('carbine', built.carbine, [0, 0, 0], 1.2);
        if (centrifugeMesh) {
          const group = new THREE.Group();
          group.position.set(3, 0, 0);
          for (let i = -1; i <= 1; i++) {
            const m = i === 0 ? centrifugeMesh : centrifugeMesh.clone();
            m.position.x = i * 0.6;
            group.add(m);
          }
          scene.add(group);
          group.updateMatrixWorld(true);
          const box3 = new THREE.Box3().setFromObject(group);
          const size = box3.getSize(new THREE.Vector3());
          pedestals.push({
            group,
            radius: Math.max(size.x, size.y, size.z) * 0.5,
            centerY: (box3.min.y + box3.max.y) / 2,
            lookY: box3.min.y + size.y * 0.45,
          });
        }
        if (built.beacon) place('beacon', built.beacon, [6, 0, 0], 0);
        if (built.charge) {
          scene.add(makePanel([8.6, 1, 0.02]));
          place('charge', built.charge, [8.6, 0, 0], 1);
        }
        const rows = pedestals.map((p) => p.group.position.x);
        camera.position.set(0, 3.2, 9);
        camera.lookAt(0, 1, 0);
        camera.far = 400;
        camera.updateProjectionMatrix();
        void rows;
      } else {
        scene.add(makeFloor(show === 'centrifuge' ? 18 : 10));
        // offset in z too, like the 'all' layout -- a pure -x offset lines up with an x=0 model's own silhouette
        // in view=side, where the camera looks straight down the x axis
        scene.add(makePost([show === 'centrifuge' ? -2 : -1.4, 0, 1]));
        if (show === 'sentry') place('sentry', built.sentry, [0, 0, 0], 0);
        else if (show === 'drone') place('drone', built.drone, [0, 0, 0], 1.3);
        else if (show === 'carbine') place('carbine', built.carbine, [0, 0, 0], 1.2);
        else if (show === 'beacon') place('beacon', built.beacon, [0, 0, 0], 0);
        else if (show === 'charge') {
          scene.add(makePanel([0, 1, 0.02]));
          place('charge', built.charge, [0, 0, 0], 1);
        } else if (show === 'centrifuge' && centrifugeMesh) {
          const group = new THREE.Group();
          for (let i = -1; i <= 1; i++) {
            const m = i === 0 ? centrifugeMesh : centrifugeMesh.clone();
            m.position.x = i * 0.6;
            group.add(m);
          }
          scene.add(group);
          group.updateMatrixWorld(true);
          const box3 = new THREE.Box3().setFromObject(group);
          const size = box3.getSize(new THREE.Vector3());
          pedestals.push({
            group,
            radius: Math.max(size.x, size.y, size.z) * 0.5,
            centerY: (box3.min.y + box3.max.y) / 2,
            lookY: box3.min.y + size.y * 0.45,
          });
        } else if (show === 'pistol') place('pistol', built.pistol, [0, 0, 0], 1.1);
        else if (show === 'shotgun') place('shotgun', built.shotgun, [0, 0, 0], 1.1);
        else if (show === 'grenade') place('grenade', built.grenade, [0, 0, 0], 1.1);
        else {
          throw new Error(`unknown ?show=: "${show}"`);
        }
        singlePedestal = pedestals[pedestals.length - 1] || null;
        if (singlePedestal) frameOn(singlePedestal, view);
      }

      const hud = document.getElementById('hud');
      hud.textContent =
        `show=${show} view=${fpMode ? 'fp' : view} pose=${pose} probe=${probeName}\n` +
        Object.entries(triangles)
          .map(([k, v]) => `${k}: ${v}/${BUDGET[k]}`)
          .join('  ');

      function layout() {
        const w = canvas.clientWidth,
          h = canvas.clientHeight;
        if (canvas.width !== w || canvas.height !== h) {
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }
      }

      let frames = 0;
      function frame() {
        layout();
        renderer.render(scene, camera);
        if (++frames === 4) window.__ready = true;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
