<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lodestar — next carbine</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05080b;
        color: #9fb3ad;
        font:
          12px ui-monospace,
          Menlo,
          Consolas,
          monospace;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        left: 10px;
        top: 6px;
        white-space: pre;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud"></div>
    <script type="module">
      // A viewer for src/gfx/next/carbine.js (copied from tools/preview/models.html and trimmed to just this one
      // model, so the camera can sit close on it rather than share a room with seven others).
      //
      // ?show=carbine|carbineFP              static turntable, or the true first-person rig (default: carbine)
      // &view=front|side|back|quarter|top|receiver|grip|optic|stock   camera angle for ?show=carbine (default: quarter)
      // &pose=rest|reload                    ?show=carbine only — "reload" drops the mag and racks the bolt back
      // &pose=hip|aim                        ?show=carbineFP only — the two first-person poses
      // &probe=dim|warm|cold|bright          the light colour fed to ownMaterials()/setProbe() (default: bright)
      // &detail=low|medium|high              setGeoDetail before building (default: medium)
      // &solo=armL|armR|body|mag|bolt        hide every other top-level part, for a close look at just one
      import * as THREE from 'three';
      import { lit, ownMaterials, setProbe, setLook } from '/src/gfx/materials.js';
      import { setGeoDetail } from '/src/gfx/geo.js';
      import { LOOK_GLSL } from '/src/look/glsl.js';
      import { loadMatter } from '/src/look/matter.js';
      import { buildCarbine } from '/src/gfx/next/carbine.js';

      const q = new URLSearchParams(location.search);
      const show = q.get('show') || 'carbine';
      const view = q.get('view') || 'quarter';
      const fpMode = show === 'carbineFP';
      const pose = q.get('pose') || (fpMode ? 'hip' : 'rest');
      const probeName = q.get('probe') || 'bright';
      const detailName = q.get('detail') || 'medium';
      const solo = q.get('solo') || ''; // 'armL' | 'armR' | 'body' — hide every other top-level part, for close inspection

      const DETAIL = {
        low: { bevel: false, round: 1 },
        medium: { bevel: true, round: 1.5 },
        high: { bevel: true, round: 2 },
      };
      // the second look on before any material is made: every part then carries a real `mat` attribute
      // (the catalogue in gfx/matter.js) instead of a colour-guessed layer, same as the game draws it.
      setLook({ on: true, matter: true, glsl: LOOK_GLSL });
      await loadMatter({ size: 512 });
      setGeoDetail({ ...(DETAIL[detailName] || DETAIL.medium), matter: true });

      // dim is the exact value a dark corner of the site gives (see DESIGN.md 8.1); warm/cold/bright are mine,
      // just spanning the range a model has to read in.
      const PROBES = {
        dim: new THREE.Color(0.08, 0.1, 0.14),
        warm: new THREE.Color(0.55, 0.42, 0.3),
        cold: new THREE.Color(0.3, 0.38, 0.48),
        bright: new THREE.Color(1.05, 1.02, 0.95),
      };
      const probeColor = PROBES[probeName] || PROBES.bright;

      // --------------------------------------------------------------------------------------------- build + count
      function triCount(geometry) {
        if (!geometry) return 0;
        return (geometry.index ? geometry.index.count : geometry.attributes.position.count) / 3;
      }
      function countModel(root, parts) {
        const nameOf = (o) => {
          for (const [k, v] of Object.entries(parts || {})) if (o === v) return k;
          return o.name || 'other';
        };
        const perPart = {};
        let n = 0;
        root.traverse((node) => {
          if (!node.isMesh) return;
          const t = triCount(node.geometry);
          n += t;
          const k = nameOf(node);
          perPart[k] = (perPart[k] || 0) + t;
        });
        return { total: Math.round(n), perPart };
      }

      let carbine = null;
      try {
        carbine = buildCarbine();
      } catch (e) {
        console.error(`carbine: threw — ${(e && e.stack) || e}`);
      }
      const triangles = carbine ? countModel(carbine.root, carbine.parts) : { total: 0, perPart: {} };
      window.__models = { triangles, detail: detailName };

      if (carbine) setProbe(ownMaterials(carbine.root), probeColor);
      if (carbine && solo && carbine.parts[solo])
        for (const [k, v] of Object.entries(carbine.parts)) if (k !== solo && v.isObject3D) v.visible = false;

      // --------------------------------------------------------------------------------------------- pose
      if (carbine && !fpMode && pose === 'reload') {
        const p = carbine.parts;
        p.mag.position.y -= 0.12;
        p.mag.rotation.x = -0.4;
        p.bolt.position.z += 0.035;
      }

      // --------------------------------------------------------------------------------------------- scene
      const canvas = document.getElementById('c');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(fpMode ? 55 : 50, 1, 0.03, 300);

      function makeFloor(size) {
        const geo = new THREE.PlaneGeometry(size, size, 24, 24).rotateX(-Math.PI / 2);
        const col = new Float32Array(geo.attributes.position.count * 3);
        for (let i = 0; i < geo.attributes.position.count; i++) {
          const d = Math.hypot(geo.attributes.position.getX(i), geo.attributes.position.getZ(i));
          const k = Math.max(0, 1 - d / (size * 0.55)) ** 2;
          col.set([0.03 + 0.5 * k, 0.035 + 0.46 * k, 0.045 + 0.4 * k], i * 3);
        }
        geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
        return new THREE.Mesh(geo, lit({ baked: true }));
      }

      let pedestal = null;
      function place(model, displayY) {
        const group = new THREE.Group();
        group.position.set(0, displayY, 0);
        group.add(model.root);
        scene.add(group);
        model.root.updateMatrixWorld(true);
        const box3 = new THREE.Box3().setFromObject(model.root);
        const size = box3.getSize(new THREE.Vector3());
        const radius = Math.max(size.x, size.y, size.z, 0.3) * 0.5;
        pedestal = {
          group,
          radius,
          centerY: displayY + (box3.min.y + box3.max.y) / 2,
          lookY: displayY + box3.min.y + size.y * 0.45,
          box3,
        };
      }

      // tighter than tools/preview/models.html's frameOn: that one shares a room with seven other models and
      // leaves headroom round each; here the gun is the whole show, so the padding past its bounding radius is
      // cut down to make it fill most of the frame's width.
      function frameOn(viewName) {
        const { radius: fullRadius, centerY, box3 } = pedestal;
        // `solo` isolates one part inside a bounding box still sized for the whole gun — frame on a fraction
        // of that radius instead, or the part would sit tiny in the middle of the frame. `body` is nearly as
        // long as the whole gun (only the trailing sleeves are longer), so it keeps most of the radius; the
        // arms are much smaller and need a much tighter fraction.
        const soloScale = solo === 'body' ? 0.8 : 0.16;
        const radius = solo ? fullRadius * soloScale : fullRadius;
        const dist = radius / Math.tan((camera.fov * Math.PI) / 180 / 2) + radius * 1.08;
        const cx = 0;
        const cz = 0;
        // centerY is displayY plus the box's own local vertical midpoint, which sits well below the optic —
        // recovering the bare displayY lets the optic view target the sight's real local height directly.
        const displayY = centerY - (box3.min.y + box3.max.y) / 2;
        const positions = {
          // the model points down -Z, so the camera sits on the -Z side to see the front.
          front: [cx, centerY + radius * 0.15, cz - dist],
          back: [cx, centerY + radius * 0.15, cz + dist],
          side: [cx + dist, centerY + radius * 0.15, cz],
          other: [cx - dist, centerY + radius * 0.15, cz],
          quarter: [cx + dist * 0.68, centerY + dist * 0.38, cz - dist * 0.68],
          top: [cx + 0.001, centerY + dist * 1.1, cz + 0.001],
          // a close view of the upper receiver / ejection port / optic, not the whole gun's bounding sphere
          receiver: [cx + radius * 0.62, centerY + radius * 0.22, cz - radius * 0.3],
          // a close view of the grip/trigger-guard area and the firing hand wrapped round it — fixed, small
          // metre offsets (not radius-scaled): the model's own length dominates radius, so a radius fraction
          // overshoots the much smaller vertical/lateral spread around the grip.
          grip: [cx + 0.2, centerY + 0.08, cz + 0.22],
          // a close, near head-on view of the optic mount's left flat, to check the rack-number lettering
          optic: [cx - 0.15, displayY + 0.19, cz - 0.1],
          // a close three-quarter view of the stock, clear of the sleeves (use with &solo=body)
          stock: [cx + 0.17, displayY + 0.13, cz + 0.32],
        };
        const p = positions[viewName] || positions.quarter;
        camera.position.set(p[0], p[1], p[2]);
        if (viewName === 'receiver') camera.lookAt(cx + 0.01, centerY + radius * 0.12, cz - radius * 0.55);
        else if (viewName === 'grip') camera.lookAt(cx, centerY + 0.01, cz + 0.02);
        else if (viewName === 'optic') camera.lookAt(cx, displayY + 0.17, cz - 0.112);
        else if (viewName === 'stock') camera.lookAt(cx, displayY + 0.07, cz + 0.2);
        else camera.lookAt(cx, pedestal.lookY, cz);
        camera.near = Math.max(0.01, dist * 0.01);
        camera.far = dist * 8 + 60;
        camera.updateProjectionMatrix();
        void box3;
      }

      // a 1.8 m reference post, baked light, so height reads at a glance next to the gun
      function makePost(at) {
        const geo = new THREE.BoxGeometry(0.05, 1.8, 0.05);
        geo.translate(0, 0.9, 0);
        const col = new Float32Array(geo.attributes.position.count * 3).fill(0);
        for (let i = 0; i < geo.attributes.position.count; i++) col.set([0.73, 0.76, 0.78], i * 3);
        geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
        const m = new THREE.Mesh(geo, lit({ baked: true }));
        m.position.set(at[0], 0, at[2]);
        return m;
      }

      if (fpMode) {
        // true first-person rig: camera at the origin, the gun placed the way the game places it
        // (src/weapon.js createWeapon / src/arms.js FEEL) — close enough here that the gun fills most of the
        // width, same as the game's own FOV would.
        if (carbine) {
          const { root, parts } = carbine;
          scene.add(root);
          if (pose === 'aim') {
            const sightLocal = parts.sight.position;
            root.position.set(-sightLocal.x, -sightLocal.y, -0.16 - sightLocal.z);
            root.rotation.set(0, 0, 0);
          } else {
            root.position.set(0.17, -0.19, -0.42);
            root.rotation.set(0, 0.12, 0); // turned very slightly inward
          }
        }
        camera.position.set(0, 0, 0);
        camera.rotation.set(0, 0, 0);
        camera.near = 0.01;
        camera.far = 20;
        camera.updateProjectionMatrix();
      } else {
        scene.add(makeFloor(10));
        scene.add(makePost([-0.9, 0, 0.4]));
        if (carbine) place(carbine, 1.2);
        if (pedestal) frameOn(view);
        window.__pedestal = pedestal; // for tools/preview tuning only — not read by the game or tests
      }

      const hud = document.getElementById('hud');
      hud.textContent =
        `show=${show} view=${fpMode ? 'fp:' + pose : view} pose=${pose} probe=${probeName} detail=${detailName}\n` +
        `carbine: ${triangles.total} tri  ` +
        Object.entries(triangles.perPart)
          .map(([k, v]) => `${k}:${v}`)
          .join('  ');

      function layout() {
        const w = canvas.clientWidth,
          h = canvas.clientHeight;
        if (canvas.width !== w || canvas.height !== h) {
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }
      }

      let frames = 0;
      function frame() {
        layout();
        renderer.render(scene, camera);
        if (++frames === 4) window.__ready = true;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
