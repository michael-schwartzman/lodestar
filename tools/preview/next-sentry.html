<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lodestar — next/sentry</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05080b;
        color: #9fb3ad;
        font:
          12px ui-monospace,
          Menlo,
          Consolas,
          monospace;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        left: 10px;
        top: 6px;
        white-space: pre;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud"></div>
    <script type="module">
      // A viewer for src/gfx/next/sentry.js — the sentry's replacement build, on its own (see tools/preview/models.html
      // for the full roster this one is copied from).
      //
      // &view=front|side|back|quarter|top|head  camera angle (default: quarter); 'head' is a close three-quarter
      //                                       view framed tightly on parts.head, for sensor/visor/antenna detail.
      // &pose=rest|walk|aim                  a walk mid-stride, or armR raised to aim (same angles the game uses,
      //                                       enemies/index.js) — rest is the bind pose.
      // &probe=dim|warm|cold|bright          the light colour fed to ownMaterials()/setProbe() (default: bright)
      // &detail=low|medium|high              setGeoDetail before building (default: medium, geo.js's own default)
      import * as THREE from 'three';
      import { lit, ownMaterials, setProbe } from '/src/gfx/materials.js';
      import { box, merge, setGeoDetail } from '/src/gfx/geo.js';
      import { buildSentry } from '/src/gfx/next/sentry.js';

      const q = new URLSearchParams(location.search);
      const view = q.get('view') || 'quarter';
      const pose = q.get('pose') || 'rest';
      const probeName = q.get('probe') || 'bright';
      const detail = q.get('detail');

      // dim is the exact value a dark corner of the site gives (see DESIGN.md 8.1); warm/cold/bright are mine,
      // just spanning the range a model has to read in.
      const PROBES = {
        dim: new THREE.Color(0.08, 0.1, 0.14),
        warm: new THREE.Color(0.55, 0.42, 0.3),
        cold: new THREE.Color(0.3, 0.38, 0.48),
        bright: new THREE.Color(1.05, 1.02, 0.95),
      };
      const probeColor = PROBES[probeName] || PROBES.bright;

      const DETAILS = {
        low: { bevel: false, round: 1 },
        medium: { bevel: true, round: 1.5 },
        high: { bevel: true, round: 2 },
      };
      if (detail && DETAILS[detail]) setGeoDetail(DETAILS[detail]);

      // --------------------------------------------------------------------------------------------- build + count
      function triCount(geometry) {
        if (!geometry) return 0;
        return (geometry.index ? geometry.index.count : geometry.attributes.position.count) / 3;
      }
      function countModel(root) {
        let n = 0;
        root.traverse((node) => {
          if (node.isMesh) n += triCount(node.geometry);
        });
        return Math.round(n);
      }

      const sentry = buildSentry();
      const triangles = countModel(sentry.root);
      window.__models = { triangles: { sentry: triangles } };

      // every model gets its own materials and probe, exactly the way the game lights each instance.
      setProbe(ownMaterials(sentry.root), probeColor);

      // --------------------------------------------------------------------------------------------- pose
      // the same angles enemies/index.js drives the walk cycle and the aim pose with (models.html carries the
      // identical block for the old builder) — keeping them here proves the new rig still takes the same joints.
      const p = sentry.parts;
      if (pose === 'walk') {
        p.legL.rotation.x = 0.5;
        p.shinL.rotation.x = 0.55;
        p.legR.rotation.x = -0.45;
        p.shinR.rotation.x = 0.1;
        p.hips.rotation.y = 0.06;
        p.torso.rotation.y = -0.07;
        p.armL.rotation.x = -0.3;
        p.armR.rotation.x = 0.2;
      } else if (pose === 'aim') {
        p.armR.rotation.x = 1.45; // must point the gun straight ahead, level — see DESIGN.md 8.2
        p.torso.rotation.x = 0.04;
      }

      // --------------------------------------------------------------------------------------------- scene
      const canvas = document.getElementById('c');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, 1, 0.03, 300);

      // baked floor: the same radial-falloff trick as tools/preview/materials.html, just so the model stands on
      // something and scale can be judged.
      function makeFloor(size) {
        const geo = new THREE.PlaneGeometry(size, size, 24, 24).rotateX(-Math.PI / 2);
        const col = new Float32Array(geo.attributes.position.count * 3);
        for (let i = 0; i < geo.attributes.position.count; i++) {
          const d = Math.hypot(geo.attributes.position.getX(i), geo.attributes.position.getZ(i));
          const k = Math.max(0, 1 - d / (size * 0.55)) ** 2;
          col.set([0.03 + 0.5 * k, 0.035 + 0.46 * k, 0.045 + 0.4 * k], i * 3);
        }
        geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
        return new THREE.Mesh(geo, lit({ baked: true }));
      }
      // a 1.8 m reference post, baked light, so height reads at a glance next to the model
      function makePost(at) {
        const g = merge([
          box(0.05, 1.8, 0.05, 0xb9c3c6, [0, 0.9, 0], undefined, { bottom: 0.5, top: 0.95 }),
          box(0.09, 0.02, 0.09, 0xe0922e, [0, 1.8, 0]),
        ]);
        const m = new THREE.Mesh(g, lit({ baked: true }));
        m.position.set(at[0], 0, at[2]);
        return m;
      }

      scene.add(makeFloor(10));
      scene.add(makePost([-1.4, 0, 1]));
      scene.add(sentry.root);
      sentry.root.updateMatrixWorld(true);
      const box3 = new THREE.Box3().setFromObject(sentry.root);
      const size = box3.getSize(new THREE.Vector3());
      const center = box3.getCenter(new THREE.Vector3());
      const lookY = box3.min.y + size.y * 0.55;

      // the head alone, for a close look at the sensor housing/visor/antenna — framed on its own box, not the
      // whole model's, or it would sit tiny in the middle of a frame sized for a 1.9 m biped.
      const headBox3 = new THREE.Box3().setFromObject(sentry.parts.head);
      const headSize = headBox3.getSize(new THREE.Vector3());
      const headCenter = headBox3.getCenter(new THREE.Vector3());

      // frame tight on the model's own silhouette for the chosen view, not a worst-case sphere — a 1.97 m tall,
      // ~1 m wide biped left most of the frame empty if you size the shot to its tallest *or* widest dimension.
      function frameOn(viewName) {
        if (viewName === 'head') {
          const vFov = (camera.fov * Math.PI) / 180;
          const r = Math.max(headSize.x, headSize.y, headSize.z) * 0.5;
          const dist = Math.max((r * 1.35) / Math.tan(vFov / 2), 0.15);
          camera.position.set(headCenter.x + dist * 0.55, headCenter.y + dist * 0.22, headCenter.z - dist * 0.78);
          camera.lookAt(headCenter.x, headCenter.y, headCenter.z);
          camera.near = Math.max(0.01, dist * 0.02);
          camera.far = dist * 8 + 60;
          camera.updateProjectionMatrix();
          return;
        }
        const dims = {
          front: { w: size.x, h: size.y },
          back: { w: size.x, h: size.y },
          side: { w: size.z, h: size.y },
          quarter: { w: (size.x + size.z) * 0.72, h: size.y },
          top: { w: size.x, h: size.z },
        };
        const { w, h } = dims[viewName] || dims.quarter;
        const margin = 1.15; // a little headroom so the model doesn't touch the frame edge
        const vFov = (camera.fov * Math.PI) / 180;
        const distForHeight = (h * margin) / 2 / Math.tan(vFov / 2);
        const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
        const distForWidth = (w * margin) / 2 / Math.tan(hFov / 2);
        const dist = Math.max(distForHeight, distForWidth, 0.3);
        const cx = center.x;
        const cz = center.z;
        const centerY = (box3.min.y + box3.max.y) / 2;
        // the model faces -Z, so the camera sits on the -Z side to see the front.
        const positions = {
          front: [cx, centerY, cz - dist],
          back: [cx, centerY, cz + dist],
          side: [cx + dist, centerY, cz],
          quarter: [cx + dist * 0.72, centerY + dist * 0.38, cz - dist * 0.72],
          top: [cx + 0.001, centerY + dist * 1.3, cz + 0.001],
        };
        const pos = positions[viewName] || positions.quarter;
        camera.position.set(pos[0], pos[1], pos[2]);
        camera.lookAt(cx, lookY, cz);
        camera.near = Math.max(0.02, dist * 0.01);
        camera.far = dist * 8 + 60;
        camera.updateProjectionMatrix();
      }

      const hud = document.getElementById('hud');
      hud.textContent = `sentry view=${view} pose=${pose} probe=${probeName} detail=${detail || 'medium (default)'}\ntriangles=${triangles}`;

      function layout() {
        const w = canvas.clientWidth,
          h = canvas.clientHeight;
        if (canvas.width !== w || canvas.height !== h) {
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          frameOn(view);
        }
      }

      let frames = 0;
      function frame() {
        layout();
        renderer.render(scene, camera);
        if (++frames === 4) window.__ready = true;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
